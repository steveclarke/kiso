name: kiso
services:
  lookbook:
    env_var: LOOKBOOK_PORT
    hostname: lookbook.kiso.test
  docs:
    env_var: DOCS_PORT
    hostname: docs.kiso.test
  dummy:
    env_var: DUMMY_PORT
    hostname: dummy.kiso.test

computed:
  PC_SOCKET_PATH:
    value: "/tmp/process-compose-${project_name}${instance:+-${instance}}.sock"
    env_file: .pc_env
